<header class="ax-mast g-mast">
  <div>
    <h1>M&amp;M launcher v3 assembly</h1>
    <div class="ax-meta" id="meta"></div>
  </div>
  <div class="g-tabs" role="tablist">
    <button class="ax-btn" role="tab" data-tab="steps">Build steps</button>
    <button class="ax-btn" role="tab" data-tab="overview">Parts and plates</button>
  </div>
</header>

<main class="g-main">
  <aside class="ax-panel g-side" id="side"></aside>

  <section class="g-center">
    <div class="ax-panel g-view" id="view">
      <div class="g-badge" id="badge"></div>
      <div class="g-legend" id="legend"></div>
      <div class="g-empty" id="empty"></div>
      <div class="ax-viewport-hint">Drag to orbit · scroll to zoom · click a part</div>
    </div>

    <div class="ax-panel g-controls" id="controls">
      <div class="g-row">
        <div class="g-nav" data-steps-only>
          <button class="ax-btn" id="prev" title="Previous step (left arrow)">&#9664; Prev</button>
          <button class="ax-btn primary" id="next" data-fx="sparks" title="Next step (right arrow)">Next step &#9654;</button>
          <div class="g-read"><span class="ax-label">Step</span><b id="stepNo">0</b><small id="stepOf">/ 0</small></div>
        </div>
        <label class="g-slider" data-steps-only title="Hold this step's parts apart, along the way they go in"><span class="ax-label">Hold apart</span>
          <input class="ax-range" type="range" id="explode" min="0" max="100" value="0">
          <b><span id="explodeOut">0</span><small>%</small></b></label>
        <div class="g-btns">
          <button class="ax-btn g-toggle" id="ghost" aria-pressed="false">Ghost the rest</button>
          <button class="ax-btn g-toggle" id="follow" aria-pressed="false" title="Camera follows each step's parts; off = stationary main view">Follow parts</button>
          <button class="ax-btn" id="mainview">Main view</button>
        </div>
      </div>
      <div class="g-row">
        <label class="g-slider"><span class="ax-label">Pan</span>
          <input class="ax-range" type="range" id="pan" min="-90" max="90" step="1" value="0">
          <b><span id="panOut">0</span><small>°</small></b></label>
        <label class="g-slider"><span class="ax-label">Tilt</span>
          <input class="ax-range" type="range" id="tilt" min="0" max="45" step="1" value="0">
          <b><span id="tiltOut">0</span><small>°</small></b></label>
        <div class="g-btns">
          <button class="ax-btn g-toggle" id="spin" aria-pressed="false">Spin flywheel</button>
          <button class="ax-btn g-toggle" id="feed" aria-pressed="false">Feeder index</button>
          <div class="g-read"><span class="ax-label">Disc</span><b id="feedOut">0</b><small>°</small></div>
          <button class="ax-btn" id="home">Home pose</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="ax-panel g-detail" id="detail"></aside>
</main>
